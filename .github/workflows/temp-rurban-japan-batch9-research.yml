name: Temporary Research Rurban Japan Batch9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch9-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Search official sites and inspect candidate pages
        shell: python
        run: |
          import html
          import json
          import re
          import time
          from urllib.parse import quote, urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          S = requests.Session()
          H = {'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152.0 Safari/537.36'}

          queries = [
              ('HIMEJI', 'site:city.himeji.lg.jp 大手前通り 再整備 基本計画 PDF 社会実験'),
              ('MATSUYAMA', 'site:city.matsuyama.ehime.jp 花園町通り 基本計画 PDF 社会実験'),
              ('FUKUI', 'site:city.fukui.lg.jp 中心市街地活性化 基本計画 フォローアップ PDF'),
              ('UTSUNOMIYA', 'site:city.utsunomiya.lg.jp LRT 駅東口 まちづくり 基本計画 PDF'),
              ('NAGANO', 'site:city.nagano.nagano.jp 中心市街地活性化 基本計画 フォローアップ PDF'),
              ('KANAZAWA', 'site:city.kanazawa.ishikawa.jp 中心市街地 ウォーカブル 基本計画 PDF'),
              ('HIROSHIMA', 'site:city.hiroshima.lg.jp 都心活性化 公共空間 社会実験 PDF'),
              ('KITAKYUSHU', 'site:city.kitakyushu.lg.jp 小倉都心 ウォーカブル 社会実験 PDF'),
          ]

          def ddg(q):
              url = 'https://html.duckduckgo.com/html/?q=' + quote(q)
              r = S.get(url, headers=H, timeout=60)
              print('SEARCH', q, r.status_code, len(r.content), r.url)
              r.raise_for_status()
              soup = BeautifulSoup(r.content, 'html.parser')
              out=[]
              for a in soup.select('a.result__a')[:15]:
                  href=a.get('href','')
                  title=' '.join(a.stripped_strings)
                  out.append((title,href))
              return out

          all_urls=[]
          for tag,q in queries:
              print('\n===',tag,'===')
              try:
                  results=ddg(q)
              except Exception as e:
                  print('SEARCH_FAIL',repr(e)); continue
              for title,href in results:
                  print('RESULT',title,'=>',href)
                  all_urls.append((tag,href,title))
              time.sleep(1)

          # Inspect unique official HTML pages returned by search and print PDF links and page titles.
          seen=set()
          for tag,url,title in all_urls:
              if url in seen or '.pdf' in url.lower():
                  continue
              seen.add(url)
              try:
                  r=S.get(url,headers=H,timeout=45,allow_redirects=True)
                  ctype=r.headers.get('content-type','')
                  print('\nPAGE',tag,r.status_code,ctype,r.url,'TITLE_HINT',title[:100])
                  if r.status_code!=200 or 'html' not in ctype.lower():
                      continue
                  text=r.content.decode('utf-8',errors='replace')
                  soup=BeautifulSoup(text,'html.parser')
                  page_title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  print('TITLE',page_title)
                  links=[]
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a['href'])
                      label=' '.join(a.stripped_strings)
                      blob=(label+' '+href).lower()
                      if '.pdf' in blob or 'pdf' in blob:
                          if href not in {u for _,u in links}:
                              links.append((label,href))
                  print('PDF_LINKS',len(links))
                  for label,href in links[:120]:
                      print('PDF',label[:160],'=>',href)
              except Exception as e:
                  print('PAGE_FAIL',url,repr(e))
