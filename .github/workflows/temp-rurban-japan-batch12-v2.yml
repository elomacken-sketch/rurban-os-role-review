name: Temporary Rurban Japan Batch12 Commercial Tourism Chains V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch12-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pyyaml
      - name: Execute corrected batch12 downloader
        shell: python
        run: |
          from pathlib import Path
          import yaml

          source=Path('.github/workflows/temp-rurban-japan-batch12.yml')
          data=yaml.safe_load(source.read_text(encoding='utf-8'))
          script=data['jobs']['build']['steps'][2]['run']
          replacements=[
              (
                  "lambda:resolve_pdf(ONA_DOCS,('第13回','スライド'))",
                  "'https://www.town.onagawa.miyagi.jp/archive/pdf/h27_11_setumeikai13_shiryo.pdf'",
              ),
          ]
          for old,new in replacements:
              if old not in script:
                  raise SystemExit(f'Expected patch target not found: {old!r}')
              script=script.replace(old,new,1)
          exec(compile(script,'<batch12-v2>','exec'),{'__name__':'__main__'})
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch12-commercial-tourism-chains-v2
          path: |
            output/Rurban_OS_Japan_Batch12_4_Commercial_Tourism_Project_Chains.zip
            output/batch12_summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
