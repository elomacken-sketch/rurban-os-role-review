name: Temporary Rurban Japan Batch14 Commercial Operation and Recovery Chains V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch14-build-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pyyaml
      - name: Execute corrected Batch14 downloader
        shell: python
        run: |
          from pathlib import Path
          import re
          import yaml

          source = Path('.github/workflows/temp-rurban-japan-batch14-build.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          script = data['jobs']['build']['steps'][2]['run']

          replacement = r'''add(mori, '09_第2期_资产负债表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2022/11/a67ce568bf15fc8cd1dcb56099479c63.pdf')
add(mori, '10_第2期_损益计算书.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2022/11/188826975093821d04995698ff19ce9e.pdf')
add(mori, '11_第2期_个别注记表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2022/11/c2f7b67b2f758bee35b797b6e3c82248.pdf')
add(mori, '12_第3期_资产负债表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2023/10/73b90c7ea65d7405f8956c67ab73cae0.pdf')
add(mori, '13_第3期_损益计算书.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2023/10/287fd7b25ea6e3bfff075f64874cf68a.pdf')
add(mori, '14_第3期_个别注记表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2023/10/5220ec14638d114c769caf192c27f95c.pdf')
add(mori, '15_第4期_资产负债表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2024/10/eacf2c2add039ccd37734631322bcf1e.pdf')
add(mori, '16_第4期_损益计算书.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2024/10/f7adca265bdccc664b07168bb742d0b3.pdf')
add(mori, '17_第4期_个别注记表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2024/10/aed9b89962205fb83770b7329e7960a8.pdf')
add(mori, '18_第5期_资产负债表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2025/10/65ddd700cd435b4f0d89ad59295658c9.pdf')
add(mori, '19_第5期_损益计算书.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2025/10/e383f1c603bbbf373b388f5c13df7e61.pdf')
add(mori, '20_第5期_个别注记表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2025/10/c2557cea2921dca76af6d8e86a424c71.pdf')
add(mori, '21_第6期_资产负债表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2026/09/06a14dc2c2b8f9ce38e470ec168c6d3d.pdf')
add(mori, '22_第6期_损益计算书.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2026/09/c3bf56fc927a5c09667af068a2316af7.pdf')
add(mori, '23_第6期_个别注记表.pdf', 'https://morioka-buscenter.jp/wp-content/uploads/2026/09/b7329ae7bba3649e3e587e3da2208843.pdf')'''

          pattern = r"for number, period, year in \[\(9,2,2021\),\(12,3,2022\),\(15,4,2023\),\(18,5,2024\),\(21,6,2025\)\]:\n(?:    .*\n){4}"
          script, count = re.subn(pattern, replacement + '\n', script, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Morioka generated-financial block, patched {count}')

          exec(compile(script, '<batch14-v2>', 'exec'), {'__name__': '__main__'})

      - name: Upload verified PDF-only package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch14-commercial-operation-recovery-chains-v2
          path: |
            output/Rurban_OS_Japan_Batch14_4_Commercial_Operation_Recovery_Chains.zip
            output/batch14_summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
