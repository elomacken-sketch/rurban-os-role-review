name: Temporary Rurban Japan Batch6 V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-rurban-japan-batch6-v2.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - run: python -m pip install --quiet requests pypdf beautifulsoup4
      - name: Download verify package
        shell: python
        run: |
          import time,zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          root=Path('output/Rurban_OS_日本相对完整方案库_第06批_4套项目'); root.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/124','Accept':'application/pdf,text/html,*/*;q=0.8','Accept-Language':'ja,en;q=0.7'})
          page='https://www.city.sapporo.jp/keikaku/kougai/makomanai/keikakupabukome.html'
          r=s.get(page,timeout=(30,120)); r.raise_for_status(); r.encoding=r.apparent_encoding; soup=BeautifulSoup(r.text,'html.parser')
          pc=None
          for a in soup.select('a[href]'):
            if 'ご意見の概要と札幌市の考え方' in ' '.join(a.get_text(' ',strip=True).split()) and '.pdf' in a.get('href','').lower(): pc=urljoin(page,a['href']); break
          if not pc: raise SystemExit('Makomanai public comment PDF not found')
          F=[
          ('01_札幌都心_第3次都心まちづくり完整体系','01_第3次都心まちづくり計画_本书_2026.pdf','https://www.city.sapporo.jp/kikaku/downtown/plan/documents/3honsyo.pdf',150),
          ('01_札幌都心_第3次都心まちづくり完整体系','02_市民及来街者意向调查报告.pdf','https://www.city.sapporo.jp/kikaku/downtown/plan/documents/2-siryou4.pdf',50),
          ('01_札幌都心_第3次都心まちづくり完整体系','03_公开征求意见结果及政府回应.pdf','https://www.city.sapporo.jp/kikaku/downtown/plan/documents/3jitoshinmaci_pc_gaiyou.pdf',8),
          ('01_札幌都心_第3次都心まちづくり完整体系','04_第1期中期ActionProgram案_2026.pdf','https://www.city.sapporo.jp/kikaku/downtown/plan/documents/1kai_ap.pdf',20),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','01_封面目录及第1章_目的与定位.pdf','https://www.city.sapporo.jp/keikaku/kougai/makomanai/documents/makomanai_keikaku_hyousi~mokuzi~1shou.pdf',8),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','02_第2章_区域现状与问题.pdf','https://www.city.sapporo.jp/keikaku/kougai/makomanai/documents/makomanai_keikaku_2shou.pdf',20),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','03_第3章_城市营造方向.pdf','https://www.city.sapporo.jp/keikaku/kougai/makomanai/documents/makomanai_keikaku_3shou.pdf',7),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','04_第4章_土地利用计划.pdf','https://www.city.sapporo.jp/keikaku/kougai/makomanai/documents/makomanai_keikaku_4shou.pdf',18),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','05_第5章_支撑城市营造的行动.pdf','https://www.city.sapporo.jp/keikaku/kougai/makomanai/documents/makomanai_keikaku_5shou.pdf',5),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','06_第6章_智慧社区形成.pdf','https://www.city.sapporo.jp/keikaku/kougai/makomanai/documents/makomanai_keikaku_6shou.pdf',3),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','07_第7章_后续推进流程.pdf','https://www.city.sapporo.jp/keikaku/kougai/makomanai/documents/makomanai_keikaku_7shou.pdf',2),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','08_资料篇_调研论证及协商过程.pdf','https://www.city.sapporo.jp/keikaku/kougai/makomanai/documents/makomanai_keikaku_shiryouhen.pdf',40),
          ('02_真驹内站前_文旅门户及复合设施土地利用再编','09_公开征求意见结果及政府回应.pdf',pc,20),
          ('03_高田马场站区_商业站城更新完整链条','01_区域现状及问题诊断.pdf','https://www.city.shinjuku.lg.jp/content/000360570.pdf',15),
          ('03_高田马场站区_商业站城更新完整链条','02_高田马场站周边区域城市营造方针_2022.pdf','https://www.city.shinjuku.lg.jp/content/000345803.pdf',43),
          ('03_高田马场站区_商业站城更新完整链条','03_公众意见募集及说明会结果.pdf','https://www.city.shinjuku.lg.jp/content/000360586.pdf',1),
          ('03_高田马场站区_商业站城更新完整链条','04_方针制定后的推进安排.pdf','https://www.city.shinjuku.lg.jp/content/000360590.pdf',1),
          ('03_高田马场站区_商业站城更新完整链条','05_第4回推进检讨委员会_实施深化资料_2026.pdf','https://www.city.shinjuku.lg.jp/content/000450106.pdf',12),
          ('04_新宿GrandTerminal_大型商业枢纽一体化再编','01_新宿据点再整备方针_GrandTerminal一体化再编_2018.pdf','https://www.city.shinjuku.lg.jp/content/000363459.pdf',20),
          ('04_新宿GrandTerminal_大型商业枢纽一体化再编','02_公开征求意见结果及政府回应.pdf','https://www.city.shinjuku.lg.jp/content/000363461.pdf',5),
          ('04_新宿GrandTerminal_大型商业枢纽一体化再编','03_新宿GrandTerminal设计政策_2026.pdf','https://www.city.shinjuku.lg.jp/content/000452454.pdf',27)]
          total=0; size=0
          for i,(folder,name,url,minimum) in enumerate(F,1):
            d=root/folder; d.mkdir(parents=True,exist_ok=True); p=d/name; tmp=p.with_suffix('.part'); err=None
            print(f'[{i}/{len(F)}] {name}',flush=True)
            for a in range(4):
              try:
                with s.get(url,stream=True,timeout=(30,300),allow_redirects=True) as q:
                  q.raise_for_status()
                  with open(tmp,'wb') as fh:
                    for c in q.iter_content(1048576):
                      if c: fh.write(c)
                if tmp.stat().st_size<20000: raise RuntimeError('too small')
                with open(tmp,'rb') as fh:
                  if not fh.read(8).startswith(b'%PDF'): raise RuntimeError('not PDF')
                rd=PdfReader(str(tmp),strict=False); n=len(rd.pages)
                if n<minimum: raise RuntimeError(f'pages {n} below {minimum}')
                for x in {0,n//2,n-1}: _=rd.pages[x].mediabox
                tmp.replace(p); total+=n; size+=p.stat().st_size; err=None
                print(f' accepted {n} pages {p.stat().st_size/1048576:.1f}MB',flush=True); break
              except Exception as e:
                err=f'{type(e).__name__}: {e}'
                if tmp.exists(): tmp.unlink()
                if a<3: time.sleep(4*(a+1))
            if err: raise SystemExit(f'FAILED {name}: {err}')
          z=Path('output/Rurban_OS_Japan_Batch06_4_Relatively_Complete_Project_Sets.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as out:
            for p in sorted(root.rglob('*.pdf')): out.write(p,p.relative_to(root.parent))
          with zipfile.ZipFile(z) as q:
            if q.testzip(): raise SystemExit('bad zip')
            if len([n for n in q.namelist() if n.lower().endswith('.pdf')])!=len(F): raise SystemExit('count mismatch')
          print({'sets':4,'pdfs':len(F),'pages':total,'source_mb':round(size/1048576,1),'zip_mb':round(z.stat().st_size/1048576,1)},flush=True)
          if z.stat().st_size>145*1048576: raise SystemExit('zip too large')
      - uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch6-complete-sets-v2
          path: output/Rurban_OS_Japan_Batch06_4_Relatively_Complete_Project_Sets.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
