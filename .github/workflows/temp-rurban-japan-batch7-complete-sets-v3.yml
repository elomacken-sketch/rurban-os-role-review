name: Temporary Rurban Japan Batch7 Complete Sets V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch7-complete-sets-v3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests pypdf beautifulsoup4 pymupdf pyyaml
      - name: Execute corrected batch7 downloader
        shell: python
        run: |
          from pathlib import Path
          import yaml

          source = Path('.github/workflows/temp-rurban-japan-batch7-complete-sets-v2.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          script = data['jobs']['build']['steps'][1]['run']
          old = "href = urljoin(url, a.get('href', ''))"
          new = "href = urljoin(url, a.get('href', ''))\n                  href = href.replace('/page/cmsfiles/', '/cmsfiles/')"
          if old not in script:
              raise SystemExit('Expected URL normalization insertion point not found')
          script = script.replace(old, new, 1)
          exec(compile(script, '<batch7-v3>', 'exec'), {'__name__': '__main__'})
      - name: Upload verified PDF-only package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch7-complete-sets-v3
          path: output/Rurban_OS_Japan_Batch07_4_Relatively_Complete_Project_Sets.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
