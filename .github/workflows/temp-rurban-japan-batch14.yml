name: Temporary Rurban Japan Batch14 Commercial Operations Chains

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch14.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf

      - name: Download validate and package official PDF originals
        shell: python
        run: |
          from __future__ import annotations

          from pathlib import Path
          from urllib.parse import urljoin
          import hashlib
          import html as htmlmod
          import json
          import re
          import shutil
          import time
          import unicodedata
          import zipfile

          import pymupdf
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('output')
          ROOT = OUT / 'Rurban_OS_日本高质量方案库_第14批_4套商业经营项目链'
          ZIP_PATH = OUT / 'Rurban_OS_Japan_Batch14_4_Commercial_Operations_Project_Chains.zip'
          SUMMARY_PATH = OUT / 'batch14_summary.json'
          shutil.rmtree(ROOT, ignore_errors=True)
          ROOT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          retry = Retry(
              total=5,
              connect=5,
              read=5,
              backoff_factor=1.2,
              status_forcelist=(408, 425, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET', 'HEAD'}),
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.mount('http://', HTTPAdapter(max_retries=retry))
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'ja,en-US;q=0.8,en;q=0.6',
          }

          def norm(value: str) -> str:
              value = unicodedata.normalize('NFKC', htmlmod.unescape(value or '')).lower()
              return re.sub(r'[\s\u3000\-‐‑–—_・/\\()（）\[\]【】「」『』<>:：,，.。]+', '', value)

          def get(url: str, timeout: int = 180) -> requests.Response:
              last = None
              for attempt in range(1, 5):
                  try:
                      response = session.get(url, headers=HEADERS, timeout=timeout, allow_redirects=True)
                      response.raise_for_status()
                      return response
                  except Exception as exc:
                      last = exc
                      print(f'  retry {attempt}/4 {url}: {type(exc).__name__}: {exc}', flush=True)
                      time.sleep(min(2 ** attempt, 8))
              raise RuntimeError(f'GET failed after retries: {url}: {last}')

          page_cache: dict[str, list[tuple[str, str]]] = {}

          def page_links(page_url: str) -> list[tuple[str, str]]:
              if page_url in page_cache:
                  return page_cache[page_url]
              response = get(page_url, 120)
              try:
                  text = response.content.decode('utf-8')
              except UnicodeDecodeError:
                  text = response.content.decode(response.apparent_encoding or 'cp932', errors='replace')
              soup = BeautifulSoup(text, 'html.parser')
              links: list[tuple[str, str]] = []
              seen: set[str] = set()
              for anchor in soup.find_all('a', href=True):
                  href = urljoin(response.url, anchor.get('href', '').strip())
                  href = href.replace('/page/cmsfiles/', '/cmsfiles/')
                  label = ' '.join(anchor.stripped_strings)
                  if href and href not in seen:
                      seen.add(href)
                      links.append((label, href))
              raw = htmlmod.unescape(text).replace('\\/', '/').replace('\\u002F', '/')
              for href in re.findall(r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?', raw, flags=re.I):
                  href = href.rstrip('\\,;)]}')
                  if href not in seen:
                      seen.add(href)
                      links.append(('', href))
              page_cache[page_url] = links
              print(f'DISCOVER {page_url}: {len(links)} links', flush=True)
              return links

          def resolve_pdf(
              page_url: str,
              include: tuple[str, ...],
              exclude: tuple[str, ...] = (),
              occurrence: int = 0,
          ) -> str:
              required = tuple(norm(x) for x in include)
              forbidden = tuple(norm(x) for x in exclude)
              ranked: list[tuple[int, str, str]] = []
              for label, href in page_links(page_url):
                  blob = norm(label + ' ' + href)
                  if not all(x in blob for x in required):
                      continue
                  if any(x in blob for x in forbidden):
                      continue
                  if '.pdf' not in href.lower() and 'pdf' not in norm(label):
                      continue
                  score = 100 if '.pdf' in href.lower() else 0
                  score += sum(35 for x in required if x in norm(label))
                  if '概要版' in label and not any('概要' in x for x in include):
                      score -= 50
                  if 'docx' in label.lower() or 'xlsx' in label.lower():
                      score -= 100
                  ranked.append((score, label, href))
              ranked.sort(reverse=True)
              if len(ranked) <= occurrence:
                  available = '\n'.join(
                      f'    {label[:150]} -> {href}'
                      for label, href in page_links(page_url)
                      if '.pdf' in href.lower() or 'pdf' in norm(label)
                  )
                  raise RuntimeError(
                      f'No PDF matched include={include!r}, exclude={exclude!r}, occurrence={occurrence} on {page_url}\n{available}'
                  )
              chosen = ranked[occurrence]
              print(f'RESOLVE {include}: {chosen[1]} -> {chosen[2]}', flush=True)
              return chosen[2]

          entries: list[dict] = []

          def add(folder: str, filename: str, source: object, min_pages: int = 1, optional: bool = False):
              entries.append({
                  'folder': folder,
                  'filename': filename,
                  'source': source,
                  'min_pages': min_pages,
                  'optional': optional,
              })

          # 01 Kobe Suma: public concept -> Park-PFI procurement/contract/risk -> selected scheme and design.
