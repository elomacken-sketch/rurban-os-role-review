name: Temporary Rurban Japan Batch7 Complete Sets V9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch7-complete-sets-v9.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests pypdf beautifulsoup4 pymupdf pyyaml
      - name: Execute corrected batch7 downloader
        shell: python
        run: |
          from pathlib import Path
          import re
          import yaml

          source = Path('.github/workflows/temp-rurban-japan-batch7-complete-sets-v2.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          script = data['jobs']['build']['steps'][1]['run']

          # Osaka City migrated the official PDF directory while leaving legacy links in its HTML.
          pattern = r"(?m)^(\s*)href = urljoin\(url, a\.get\('href', ''\)\)$"
          replacement = r"\1href = urljoin(url, a.get('href', ''))\n\1href = href.replace('/page/cmsfiles/', '/cmsfiles/')"
          script, count = re.subn(pattern, replacement, script, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Osaka URL normalization insertion point, found {count}')

          # The private Namba operator site is intermittently inaccessible from download runners.
          old_rule = "find_pdf('https://www.namba-hiroba.jp/organize/', 'なんば広場利活用ルール')"
          new_rule = "'https://www.namba-hiroba.jp/assets/uploads//2026/08/nambarule2026-08.pdf'"
          if old_rule not in script:
              raise SystemExit('Expected Namba rule lookup expression not found')
          script = script.replace(old_rule, new_rule, 1)

          # Keep only Osaka City's official implementation-plan fragments and public-response files.
          insertion = (
              "entries = [\n"
              "    e for e in entries\n"
              "    if not (\n"
              "        e[0].startswith('01_大阪难波')\n"
              "        and e[1].startswith(('01_', '02_', '03_', '04_', '05_', '15_'))\n"
              "    )\n"
              "]\n\n"
              "seen = {}"
          )
          script, count = re.subn(r'(?m)^seen = \{\}$', insertion, script, count=1)
          if count != 1:
              raise SystemExit(f'Expected one entries-filter insertion marker, found {count}')

          # Toyama's official post-evaluation sheet is a valid, complete three-page form.
          old_eval = "find_pdf(toy_eval, '事後評価シート'), 5)"
          new_eval = "find_pdf(toy_eval, '事後評価シート'), 3)"
          if old_eval not in script:
              raise SystemExit('Expected Toyama evaluation threshold expression not found')
          script = script.replace(old_eval, new_eval, 1)

          exec(compile(script, '<batch7-v9>', 'exec'), {'__name__': '__main__'})
      - name: Upload verified PDF-only package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch7-complete-sets-v9
          path: output/Rurban_OS_Japan_Batch07_4_Relatively_Complete_Project_Sets.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
