name: Temporary Discover Shin-Osaka Vision Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-debug-shinosaka-vision.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare
        run: |
          python -m pip install --quiet playwright requests
          which google-chrome || which chromium || which chromium-browser || true
      - name: Inspect rendered official vision page and network assets
        shell: python
        run: |
          import json
          import re
          import shutil
          from playwright.sync_api import sync_playwright

          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome:
              raise SystemExit('No system Chromium executable found')

          targets = [
              'https://shinosaka-south.com/vision-1',
              'https://shinosaka-south.com/information/bAFx9QQF',
          ]
          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path=chrome, headless=True, args=['--no-sandbox'])
              for target in targets:
                  page = browser.new_page(viewport={'width': 1440, 'height': 1200})
                  responses = []
                  page.on('response', lambda r: responses.append((r.status, r.url, r.headers.get('content-type', ''))))
                  try:
                      page.goto(target, wait_until='networkidle', timeout=120000)
                      page.wait_for_timeout(5000)
                      print('\nPAGE', target, '=>', page.url, page.title())
                      anchors = page.locator('a').evaluate_all("""els => els.map(e => ({text:(e.innerText||e.textContent||'').trim(), href:e.href, target:e.target}))""")
                      print('ANCHORS', len(anchors))
                      for a in anchors:
                          if any(k in (a['text'] + ' ' + a['href']).lower() for k in ['pdf','drive','storage.googleapis','ダウンロード','全文','vision','ビジョン']):
                              print('A', json.dumps(a, ensure_ascii=False))
                      body_text = page.locator('body').inner_text()
                      print('BODY_HEAD', repr(body_text[:12000]))
                      html = page.content()
                      patterns = [
                          r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
                          r'https?://drive\.google\.com/[^\s"\'<>]+',
                          r'https?://storage\.googleapis\.com/[^\s"\'<>]+',
                      ]
                      for pattern in patterns:
                          for u in sorted(set(re.findall(pattern, html, flags=re.I))):
                              print('HTMLURL', u[:1500])
                      print('NETWORK_INTERESTING')
                      for status, url, ctype in responses:
                          low = (url + ' ' + ctype).lower()
                          if any(k in low for k in ['pdf','drive','storage.googleapis','vision','page-views','product.json','project.json']):
                              print('NET', status, ctype, url)
                  except Exception as exc:
                      print('PAGE FAILED', target, repr(exc))
                  finally:
                      page.close()
              browser.close()
