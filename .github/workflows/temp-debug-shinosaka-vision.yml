name: Temporary Discover Shin-Osaka Vision Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-debug-shinosaka-vision.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare
        run: |
          python -m pip install --quiet playwright requests
          which google-chrome || which chromium || which chromium-browser || true
      - name: Inspect rendered official site and network assets
        shell: python
        run: |
          import json
          import re
          import shutil
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          home = 'https://shinosaka-south.com/'
          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          print('CHROME', chrome)
          if not chrome:
              raise SystemExit('No system Chromium executable found')

          responses = []
          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path=chrome, headless=True, args=['--no-sandbox'])
              page = browser.new_page(viewport={'width': 1440, 'height': 1200})
              page.on('response', lambda r: responses.append((r.status, r.url, r.headers.get('content-type', ''))))
              page.goto(home, wait_until='networkidle', timeout=120000)
              page.wait_for_timeout(5000)
              print('HOME FINAL', page.url, page.title())
              anchors = page.locator('a').evaluate_all("""els => els.map(e => ({text:(e.innerText||e.textContent||'').trim(), href:e.href, target:e.target}))""")
              print('ANCHORS', len(anchors))
              for a in anchors:
                  print('A', json.dumps(a, ensure_ascii=False))

              candidates = [a for a in anchors if any(k in (a['text'] + ' ' + a['href']).lower() for k in ['vision','ビジョン','まちづくり'])]
              print('CANDIDATES', json.dumps(candidates, ensure_ascii=False, indent=2))

              for a in candidates:
                  href = a['href']
                  if not href or href.startswith(('mailto:', 'tel:', '#')):
                      continue
                  context = page.new_page(viewport={'width': 1440, 'height': 1200})
                  local_responses = []
                  context.on('response', lambda r: local_responses.append((r.status, r.url, r.headers.get('content-type', ''))))
                  try:
                      context.goto(href, wait_until='networkidle', timeout=120000)
                      context.wait_for_timeout(4000)
                      print('\nVISIT', href, '=>', context.url, context.title())
                      subanchors = context.locator('a').evaluate_all("""els => els.map(e => ({text:(e.innerText||e.textContent||'').trim(), href:e.href, target:e.target}))""")
                      for x in subanchors:
                          if any(k in (x['text'] + ' ' + x['href']).lower() for k in ['pdf','drive','storage.googleapis','ダウンロード','全文','vision','ビジョン']):
                              print('SUBA', json.dumps(x, ensure_ascii=False))
                      html = context.content()
                      for pattern in [r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?', r'https?://drive\.google\.com/[^\s"\'<>]+', r'https?://storage\.googleapis\.com/[^\s"\'<>]+']:
                          for u in sorted(set(re.findall(pattern, html, flags=re.I))):
                              print('HTMLURL', u[:1500])
                      for status, url, ctype in local_responses:
                          low = (url + ' ' + ctype).lower()
                          if any(k in low for k in ['pdf','drive','storage.googleapis','vision','page-views','product.json']):
                              print('NET', status, ctype, url)
                  except Exception as exc:
                      print('VISIT FAILED', href, repr(exc))
                  finally:
                      context.close()

              print('\nHOME NETWORK INTERESTING')
              for status, url, ctype in responses:
                  low = (url + ' ' + ctype).lower()
                  if any(k in low for k in ['pdf','drive','storage.googleapis','vision','page-views','product.json','project.json']):
                      print('NET', status, ctype, url)
              browser.close()
