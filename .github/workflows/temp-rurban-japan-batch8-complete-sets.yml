              ('04_池袋站城公共空间_规划设计与运营规则完整体系', '12_池袋地区停车与街区营造Management_Guideline.pdf',
               lambda: find_pdf(IKE_PARKING_MGMT, ('駐車', 'まちづくりマネジメントガイドライン')), 10),
              ('04_池袋站城公共空间_规划设计与运营规则完整体系', '13_池袋地区停车场整备计划_2024改订.pdf',
               lambda: find_pdf(IKE_PARKING_PLAN, ('池袋地区駐車場整備計画',), ('概要',)), 5),
          ]

          def download_pdf(url: str, target: Path, min_pages: int) -> tuple[int, int, str]:
              url = to_download_url(url)
              r = get(url, timeout=90)
              data = r.content
              if data[:5] != b'%PDF-':
                  preview = data[:250].decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'Not a PDF: {url}; content-type={r.headers.get("content-type")}; '
                      f'bytes={len(data)}; preview={preview!r}'
                  )
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              reader = PdfReader(str(target), strict=False)
              pages = len(reader.pages)
              if pages < min_pages:
                  raise RuntimeError(f'{target}: pages {pages} below expected minimum {min_pages}')

              # Representative visual render check: first, middle, last.
              doc = fitz.open(str(target))
              if doc.page_count != pages:
                  raise RuntimeError(f'{target}: page-count mismatch pypdf={pages}, fitz={doc.page_count}')
              indices = sorted(set([0, pages // 2, pages - 1]))
              for idx in indices:
                  pix = doc.load_page(idx).get_pixmap(matrix=fitz.Matrix(0.35, 0.35), alpha=False)
                  if pix.width < 40 or pix.height < 40 or len(pix.samples) < 1000:
                      raise RuntimeError(f'{target}: failed representative render check at page {idx + 1}')
              doc.close()
              digest = hashlib.sha256(data).hexdigest()
              return pages, len(data), digest

          seen_hashes: dict[str, str] = {}
          stats: dict[str, dict[str, float]] = {}
          for idx, (folder, filename, source, min_pages) in enumerate(entries, 1):
              print(f'\n[{idx}/{len(entries)}] {folder}/{filename}')
              try:
                  url = source() if callable(source) else source
                  print(f'  {url}')
                  target = ROOT / folder / filename
                  pages, size, digest = download_pdf(url, target, min_pages)
                  if digest in seen_hashes:
                      other = seen_hashes[digest]
                      target.unlink(missing_ok=True)
                      raise RuntimeError(f'Duplicate PDF content: {folder}/{filename} == {other}')
                  seen_hashes[digest] = f'{folder}/{filename}'
                  stat = stats.setdefault(folder, {'pdfs': 0, 'pages': 0, 'bytes': 0})
                  stat['pdfs'] += 1
                  stat['pages'] += pages
                  stat['bytes'] += size
                  print(f'  accepted {pages} pages {size / 1024 / 1024:.1f} MB sha256={digest[:16]}...')
              except Exception as exc:
                  print(f'FAILED {folder}/{filename}: {type(exc).__name__}: {exc}')
                  raise

          # Package only original PDF files. No index, readme, links, scripts or manifests.
          if ZIP_PATH.exists():
              ZIP_PATH.unlink()
          with zipfile.ZipFile(ZIP_PATH, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for pdf in sorted(ROOT.rglob('*.pdf')):
                  zf.write(pdf, pdf.relative_to(ROOT.parent))

          # Verify archive entries and PDFs after packaging.
          with zipfile.ZipFile(ZIP_PATH, 'r') as zf:
              names = zf.namelist()
              if len(names) != len(entries):
                  raise RuntimeError(f'ZIP entry count {len(names)} != expected {len(entries)}')
              if any(not name.lower().endswith('.pdf') for name in names):
                  raise RuntimeError('ZIP contains a non-PDF entry')
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')

          total_pdfs = sum(int(v['pdfs']) for v in stats.values())
          total_pages = sum(int(v['pages']) for v in stats.values())
          total_bytes = sum(int(v['bytes']) for v in stats.values())
          print('\n=== BATCH 08 VERIFIED SUMMARY ===')
          for folder, v in stats.items():
              print(f"{folder}: {int(v['pdfs'])} PDFs, {int(v['pages'])} pages, {v['bytes']/1024/1024:.1f} MB")
          print({
              'sets': len(stats),
              'pdfs': total_pdfs,
              'pages': total_pages,
              'source_mb': round(total_bytes / 1024 / 1024, 1),
              'zip_mb': round(ZIP_PATH.stat().st_size / 1024 / 1024, 1),
              'zip_sha256': hashlib.sha256(ZIP_PATH.read_bytes()).hexdigest(),
          })
      - name: Upload verified PDF-only package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch8-complete-project-chains
          path: output/Rurban_OS_Japan_Batch08_4_Complete_Project_Chains.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
