name: Temporary Rurban Japan Batch14 Commercial Operation and Recovery Chains V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch14-build-v3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pyyaml
      - name: Execute corrected Batch14 runner
        run: python temp_batch14_runner.py
      - name: Upload verified PDF-only package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch14-commercial-operation-recovery-chains-v3
          path: |
            output/Rurban_OS_Japan_Batch14_4_Commercial_Operation_Recovery_Chains.zip
            output/batch14_summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
# rerun: 3
