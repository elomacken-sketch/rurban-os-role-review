name: Temporary Rurban Japan Plan Downloader Core Fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-plans-core-fast.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Prepare
        run: python -m pip install --quiet requests pypdf

      - name: Download and verify core official PDFs
        shell: python
        run: |
          import concurrent.futures
          import json
          import time
          import zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          plans = [
              {"id":"OMY01","name":"01_大丸有地区城市营造指南2023.pdf","url":"https://www.omy-committee.jp/contents/wp-content/uploads/omy-guideline-2023.pdf","min_pages":150},
              {"id":"OMY02","name":"02_大丸有都市旅游愿景.pdf","url":"https://www.omy-committee.jp/contents/wp-content/uploads/2022/08/tourism_vision.pdf","min_pages":60},
              {"id":"OMY07","name":"03_大丸有可步行愿景_本篇.pdf","url":"https://www.omy-committee.jp/images/daimaruyu-area-walkable-vision-main.pdf","min_pages":40},
              {"id":"OMY09","name":"04_大手町总体设计.pdf","url":"https://www.omy-committee.jp/contents/wp-content/uploads/otemachi-granddesign.pdf","min_pages":50},
              {"id":"OMY10","name":"05_有乐町地区未来愿景_本篇.pdf","url":"https://www.omy-committee.jp/images/yurakucho-vision-ver1.pdf","min_pages":20},
              {"id":"OMY11","name":"06_有乐町地区未来愿景_数据篇.pdf","url":"https://www.omy-committee.jp/images/yurakucho-vision-data.pdf","min_pages":30},
              {"id":"OMY14","name":"07_大丸有智慧城市执行计划_Ver1.0.pdf","url":"https://www.tokyo-omy-w.jp/data/pdf/plan-details-1.0.pdf","min_pages":50},
              {"id":"IKB01","name":"08_池袋站周边地区城市营造指南.pdf","url":"https://www.city.toshima.lg.jp/documents/14752/guideline-saikei.pdf","min_pages":40},
              {"id":"IKB08","name":"09_池袋终端导视指南_Ver1.2.pdf","url":"https://www.city.toshima.lg.jp/documents/17300/saingaidorain-honpen_kaitei1-2.pdf","min_pages":45},
              {"id":"IKB10A","name":"10A_池袋站导视整备计划_前篇.pdf","url":"https://www.city.toshima.lg.jp/documents/17300/20200331_signgaidorain-1.pdf","min_pages":20},
              {"id":"IKB10B","name":"10B_池袋站导视整备计划_后篇.pdf","url":"https://www.city.toshima.lg.jp/documents/17300/20200331_signgaidorain-2.pdf","min_pages":20},
              {"id":"ART01","name":"11_大地艺术祭2024_总括报告_本篇.pdf","url":"https://www.city.tokamachi.lg.jp/material/files/group/17/2024soukatsuhoukokusyo_honpen.pdf","min_pages":55},
              {"id":"ART02","name":"12_大地艺术祭2024_总括报告_资料篇.pdf","url":"https://www.city.tokamachi.lg.jp/material/files/group/17/2024soukatsuhoukokusyo_shiryou.pdf","min_pages":75},
              {"id":"ART05","name":"13_濑户内国际艺术祭2016_总括报告.pdf","url":"https://setouchi-artfest.jp/files/NewsBlocks/370b26f7-4633-46f8-becb-96c710974eba/value01/07b551536f8bf2e2c69e217de2e57c51.pdf","min_pages":40},
              {"id":"DMO13","name":"14_观光地域管理指南.pdf","url":"https://www.mlit.go.jp/kankocho/content/001736623.pdf","min_pages":30},
              {"id":"DMO14","name":"15_DMO_KGI_KPI设置评估手册_v1.0.pdf","url":"https://www.mlit.go.jp/kankocho/content/001889407.pdf","min_pages":60},
              {"id":"DMO16","name":"16_DMO_DX指南.pdf","url":"https://www.mlit.go.jp/kankocho/content/001902138.pdf","min_pages":120},
              {"id":"DMO31","name":"17_观光空间形成计划编制指南.pdf","url":"https://www.mlit.go.jp/kankocho/content/001750153.pdf","min_pages":60},
              {"id":"KOTO01","name":"18_琴电瓦町大楼利活用计划.pdf","url":"https://www.city.takamatsu.kagawa.jp/kurashi/shinotorikumi/machidukuri/kasseika/kotoden.files/24111_L24_rikatuyoukeikaku.pdf","min_pages":20},
              {"id":"TAKA01","name":"19_高松市中心市街地夜间景观指南2025.pdf","url":"https://www.city.takamatsu.kagawa.jp/jigyosha/toshikeikaku/keikan/keikan/index.files/takamatsu_yakan_guidline.pdf","min_pages":20},
              {"id":"SHIB01","name":"20_涩谷站中心地区广场愿景案2025.pdf","url":"https://files.city.shibuya.tokyo.jp/assets/12995aba8b194961be709ba879857f70/be903bac72cb4ed89d569afdd9100625/2025003-1.pdf","min_pages":20},
              {"id":"OSD01","name":"21_PLATEAU_高精度旅游动态分析系统_技术验证报告.pdf","url":"https://www.mlit.go.jp/plateau/file/libraries/doc/plateau_tech_doc_0100_ver01.pdf","min_pages":25},
              {"id":"OSD03","name":"22_PLATEAU_城市结构分析工具_技术验证报告.pdf","url":"https://www.mlit.go.jp/plateau/file/libraries/doc/plateau_tech_doc_0140_ver01.pdf","min_pages":25},
              {"id":"HAKA01","name":"23_博多城市营造指南2026_未来愿景2040.pdf","url":"https://hakata-machi.jp/pdf/guideline2026.pdf","min_pages":20},
              {"id":"SAPP01","name":"24_札幌站前通地区城市营造愿景2019.pdf","url":"https://www.sapporoekimae-management.jp/wp/wp-content/themes/sapporoekimae/assets/pdf/vision/vision.pdf","min_pages":18},
          ]

          out = Path('output')
          pdf_dir = out / 'pdfs'
          pdf_dir.mkdir(parents=True, exist_ok=True)

          def download(plan):
              record = {**plan, 'status':'failed', 'pages':None, 'bytes':0, 'error':''}
              target = pdf_dir / plan['name']
              tmp = target.with_suffix('.part')
              s = requests.Session()
              s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/124 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Accept-Language':'ja,en;q=0.7'})
              try:
                  for attempt in range(1,4):
                      try:
                          with s.get(plan['url'],stream=True,timeout=(25,180),allow_redirects=True) as r:
                              r.raise_for_status()
                              with open(tmp,'wb') as f:
                                  for chunk in r.iter_content(1024*1024):
                                      if chunk: f.write(chunk)
                          break
                      except Exception:
                          if tmp.exists(): tmp.unlink()
                          if attempt == 3: raise
                          time.sleep(attempt*3)
                  size=tmp.stat().st_size
                  if size < 50000: raise RuntimeError(f'file too small: {size}')
                  with open(tmp,'rb') as f: head=f.read(8)
                  if not head.startswith(b'%PDF'): raise RuntimeError(f'not PDF: {head!r}')
                  pages=len(PdfReader(str(tmp),strict=False).pages)
                  if pages < plan['min_pages']: raise RuntimeError(f'pages {pages} below {plan["min_pages"]}')
                  tmp.replace(target)
                  record.update(status='accepted',pages=pages,bytes=size,error='')
              except Exception as e:
                  record['error']=f'{type(e).__name__}: {e}'
                  if tmp.exists(): tmp.unlink()
              return record

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              fs={ex.submit(download,p):p for p in plans}
              for fut in concurrent.futures.as_completed(fs):
                  r=fut.result(); results.append(r)
                  print(f"{r['id']} {r['status']} pages={r['pages']} bytes={r['bytes']} error={r['error']}",flush=True)
          results.sort(key=lambda r:r['name'])
          accepted=[r for r in results if r['status']=='accepted']
          final_zip=out/'Rurban_OS_日本高质量完整方案库_第03批_核心实际下载原件.zip'
          with zipfile.ZipFile(final_zip,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for r in accepted:
                  z.write(pdf_dir/r['name'],arcname=r['name'])
          with open(out/'download_manifest.json','w',encoding='utf-8') as f:
              json.dump({'accepted_count':len(accepted),'attempted_count':len(results),'results':results},f,ensure_ascii=False,indent=2)
          print(f"FINAL accepted={len(accepted)}/{len(results)} zip={final_zip.stat().st_size/1024/1024:.1f}MB",flush=True)
          if len(accepted)<10: raise SystemExit('Too few verified core PDFs')

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-plans-batch3-core-fast
          path: |
            output/Rurban_OS_日本高质量完整方案库_第03批_核心实际下载原件.zip
            output/download_manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
