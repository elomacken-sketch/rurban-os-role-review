name: Temporary Rurban Japan Batch11 Complete Project Chains V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch11-complete-chains-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pyyaml

      - name: Execute corrected batch11 downloader
        shell: python
        run: |
          from pathlib import Path
          import yaml

          source = Path('.github/workflows/temp-rurban-japan-batch11-complete-chains.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          script = data['jobs']['build']['steps'][2]['run']

          replacements = [
              (
                  "lambda: resolve_pdf(OMIYA_VISION, ('6.', '検討の経緯', '1'))",
                  "'https://www.city.saitama.lg.jp/001/010/015/004/001/003/p011083_d/fil/honpen6-1.pdf'",
              ),
              (
                  "lambda: resolve_pdf(OMIYA_VISION, ('6.', '検討の経緯', '2'))",
                  "'https://www.city.saitama.lg.jp/001/010/015/004/001/003/p011083_d/fil/honpen6-2.pdf'",
              ),
          ]
          for old, new in replacements:
              if old not in script:
                  raise SystemExit(f'Expected patch target not found: {old!r}')
              script = script.replace(old, new, 1)

          exec(compile(script, '<batch11-v2>', 'exec'), {'__name__': '__main__'})

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch11-complete-project-chains-v2
          path: |
            output/Rurban_OS_Japan_Batch11_4_Complete_Project_Chains.zip
            output/batch11_summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
