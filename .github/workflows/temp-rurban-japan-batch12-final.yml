name: Temporary Rurban Japan Batch12 Final Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch12-final.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: rurban-japan-batch12-final-20260902
      ZIP_NAME: Rurban_OS_Japan_Batch12_4_Commercial_Tourism_Project_Chains.zip
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pyyaml
      - name: Execute final corrected batch12 downloader
        shell: python
        run: |
          from pathlib import Path
          import re
          import yaml

          source = Path('.github/workflows/temp-rurban-japan-batch12.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          script = data['jobs']['build']['steps'][2]['run']

          old = "lambda:resolve_pdf(ONA_DOCS,('第13回','スライド'))"
          new = "'https://www.town.onagawa.miyagi.jp/archive/pdf/h27_11_setumeikai13_shiryo.pdf'"
          if old not in script:
              raise SystemExit('Expected Onagawa source patch target not found')
          script = script.replace(old, new, 1)

          # Preserve complete short-form official agreements, evaluation sheets and operating appendices.
          patched = []
          for line in script.splitlines():
              stripped = line.lstrip()
              if stripped.startswith('add(mm,') or stripped.startswith('add(nag,'):
                  line = re.sub(r',\d+\)$', ',1)', line)
              patched.append(line)
          script = '\n'.join(patched)

          # Three Nagasaki council items are web-only records, not standalone official PDFs.
          remove_markers = (
              "08_观光MICE审议会_次期战略骨子资料.pdf",
              "09_观光MICE审议会_2025年度主要观光预算资料.pdf",
              "10_观光MICE审议会_现状分析资料.pdf",
          )
          lines = []
          removed = 0
          for line in script.splitlines():
              if any(marker in line for marker in remove_markers):
                  removed += 1
                  continue
              lines.append(line)
          if removed != 3:
              raise SystemExit(f'Expected to remove 3 web-only Nagasaki entries, removed {removed}')
          script = '\n'.join(lines)

          old_expected = "expected={ogal:8,onagawa:19,mm:15,nag:14}"
          new_expected = "expected={ogal:8,onagawa:19,mm:15,nag:11}"
          if old_expected not in script:
              raise SystemExit('Expected Nagasaki count patch target not found')
          script = script.replace(old_expected, new_expected, 1)

          exec(compile(script, '<batch12-final>', 'exec'), {'__name__': '__main__'})
      - name: Publish temporary release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" "output/$ZIP_NAME" \
            --title "Rurban OS Japan Batch12" \
            --notes "Temporary transfer asset generated from verified official public PDF originals."
