          # 02 Kure Station: recommendations -> basic plan -> national terminal plan -> public-space vision -> PPP selection/contracts -> operations needs/smart city.
          KURE_RECOMMEND = 'https://www.city.kure.lg.jp/soshiki/90/sougoukaihatu4.html'
          KURE_BASIC = 'https://www.city.kure.lg.jp/soshiki/90/kihonkeikaku.html'
          KURE_VISION = 'https://www.city.kure.lg.jp/soshiki/90/panel-discussion2.html'
          KURE_PPP = 'https://www.city.kure.lg.jp/soshiki/90/kureekiproposal001.html'
          KURE_SELECTED = 'https://www.city.kure.lg.jp/soshiki/90/kureekiproposal003.html'
