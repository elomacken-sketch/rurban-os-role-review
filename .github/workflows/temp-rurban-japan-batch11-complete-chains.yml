          KURE_SMART = 'https://www.city.kure.lg.jp/soshiki/90/kure-smart.html'
          kure = '02_吴站周边_综合交通枢纽复合开发与PPP实施完整链条'
          add(kure, '01_综合开发提言书.pdf', lambda: resolve_pdf(KURE_RECOMMEND, ('呉駅周辺地域総合開発に関する提言書',), ('案',)), 10)
          add(kure, '02_综合开发基本计划.pdf', lambda: resolve_pdf(KURE_BASIC, ('呉駅周辺地域総合開発基本計画',)), 25)
          add(kure, '03_国道31号吴站交通Terminal事业计划.pdf', 'https://www.cgr.mlit.go.jp/hirokoku/kurebasuta/pdf/jigyoukeikaku.pdf', 10)
          add(kure, '04_吴站前空间Vision2023_实施报告.pdf', lambda: resolve_pdf(KURE_VISION, ('実施報告',)), 2)
          add(kure, '05_第1期PPP_募集要项.pdf', lambda: resolve_pdf(KURE_PPP, ('募集要項',)), 5)
          add(kure, '06_第1期PPP_附属资料.pdf', lambda: resolve_pdf(KURE_PPP, ('添付資料',)), 20)
          add(kure, '07_第1期PPP_关系格式PDF版.pdf', lambda: resolve_pdf(KURE_PPP, ('関係様式', 'PDF版')), 5)
          add(kure, '08_中选事业协力者_完整提案书.pdf', lambda: resolve_pdf(KURE_SELECTED, ('くれみらい', '提案書')), 10)
          add(kure, '09_C区市有财产无偿转让合同概要.pdf', lambda: resolve_pdf(KURE_CONTRACT, ('Cゾーン', '無償譲渡契約', '概要')), 1)
          add(kure, '10_B区市有财产转让合同概要.pdf', lambda: resolve_pdf(KURE_CONTRACT, ('Bゾーン', '財産譲渡契約', '概要')), 1)
          add(kure, '11_综合开发整备概要_2024.pdf', lambda: resolve_pdf(KURE_FORUM, ('総合開発整備概要',)), 3)
          add(kure, '12_二层Deck活力创造_对话型需求调查实施要领.pdf', lambda: resolve_pdf(KURE_SURVEY, ('ニーズ調査', '実施要領')), 3)
          add(kure, '13_KURE智慧城市模型事业_完整执行计划.pdf', lambda: resolve_pdf(KURE_SMART, ('KUREスマートシティモデル事業', '実行計画'), ('概要版',)), 20)

          # 03 Maebashi: full urban-design chapters -> center-city plan/evaluation -> urban-regeneration cycles -> current redevelopment plan -> open-site operations.
          MAE_URBAN = 'https://www.city.maebashi.gunma.jp/soshiki/toshikeikakubu/shigaichiseibi/oshirase/26885.html'
          MAE_PHASE1 = 'https://www.city.maebashi.gunma.jp/sangyo_business/1/2/4/9999.html'
          MAE_PHASE2 = 'https://www.city.maebashi.gunma.jp/soshiki/toshikeikakubu/shigaichiseibi/gyomu/4/35959.html'
          MAE_REGEN = 'https://www.city.maebashi.gunma.jp/sangyo_business/1/2/4/9997.html'
          MAE_OPEN = 'https://www.city.maebashi.gunma.jp/sangyo_business/1/5/39808.html'
          maebashi = '03_前桥都心_公民协作UrbanDesign实施与评价完整闭环'
          add(maebashi, '01_UrbanDesign_1_前言.pdf', lambda: resolve_pdf(MAE_URBAN, ('1.', 'はじめに')), 3)
          add(maebashi, '02_UrbanDesign_2_现状整理.pdf', lambda: resolve_pdf(MAE_URBAN, ('2.', '現状の整理')), 10)
          add(maebashi, '03_UrbanDesign_3_民间意见汇总.pdf', lambda: resolve_pdf(MAE_URBAN, ('3.', '民間の意見集約')), 3)
          add(maebashi, '04_UrbanDesign_4_城市营造方向.pdf', lambda: resolve_pdf(MAE_URBAN, ('4.', 'まちづくりの方向性')), 3)
          add(maebashi, '05_UrbanDesign_5_长期计划.pdf', lambda: resolve_pdf(MAE_URBAN, ('5.', '長期プラン')), 5)
          add(maebashi, '06_UrbanDesign_6_城市未来图景.pdf', lambda: resolve_pdf(MAE_URBAN, ('6.', 'まちの将来像')), 5)
          add(maebashi, '07_UrbanDesign_7_生活方式提案.pdf', lambda: resolve_pdf(MAE_URBAN, ('7.', 'ライフスタイルの提案')), 3)
          add(maebashi, '08_UrbanDesign_8_设计指南.pdf', lambda: resolve_pdf(MAE_URBAN, ('8.', 'アーバンデザイン・ガイドライン')), 5)
          add(maebashi, '09_UrbanDesign_9_模型项目.pdf', lambda: resolve_pdf(MAE_URBAN, ('9.', 'モデルプロジェクト')), 5)
          add(maebashi, '10_UrbanDesign_10_实现路径.pdf', lambda: resolve_pdf(MAE_URBAN, ('10.', '実現に向けた取り組み')), 3)
          add(maebashi, '11_中心市街地活性化基本计划_本篇.pdf', 'https://www.city.maebashi.gunma.jp/material/files/group/54/master_plan_honbun.pdf', 50)
          add(maebashi, '12_中心市街地活性化基本计划_资料篇.pdf', 'https://www.city.maebashi.gunma.jp/material/files/group/54/master_plan_siryo.pdf', 30)
          add(maebashi, '13_中心市街地活性化_FinalFollowUp_本篇.pdf', 'https://www.city.maebashi.gunma.jp/material/files/group/54/followup_houkoku_honpen.pdf', 20)
          add(maebashi, '14_中心市街地活性化_FinalFollowUp_资料篇.pdf', 'https://www.city.maebashi.gunma.jp/material/files/group/54/followup_houkoku_siryou.pdf', 10)
          add(maebashi, '15_中心据点地区_第1期都市再生整备计划.pdf', lambda: resolve_pdf(MAE_PHASE1, ('都市再生整備計画', '第9回変更')), 20)
          add(maebashi, '16_中心据点地区_第1期事后评价.pdf', lambda: resolve_pdf(MAE_PHASE1, ('事後評価結果',)), 2)
          add(maebashi, '17_中心据点地区_第2期都市再生整备计划.pdf', lambda: resolve_pdf(MAE_PHASE2, ('都市再生整備計画', '第3回変更')), 20)
          add(maebashi, '18_市街地综合再生计划_2025改订.pdf', lambda: resolve_pdf(MAE_REGEN, ('市街地総合再生計画',), ('概要版', '冊子用')), 30)
          add(maebashi, '19_UrbanDesign式开放场地运营手册.pdf', lambda: resolve_pdf(MAE_OPEN, ('オープンサイト編', '冊子')), 15)

          # 04 Hiroshima Peace Boulevard: vision -> public feedback -> detailed image -> market sounding -> Park-PFI procurement -> failed-procurement learning and operations.
          HIRO_BASIC = 'https://www.city.hiroshima.lg.jp/business/kassei/1021746/1006056/1033078/1013124.html'
          HIRO_COMMENT = 'https://www.city.hiroshima.lg.jp/tourism-culture/tourism/1021448/1006056/1026901/1037455/1037476.html'
          HIRO_IMAGE = 'https://www.city.hiroshima.lg.jp/business/kassei/1021746/1006056/1026901/1033077/1017576.html'
          HIRO_SOUND = 'https://www.city.hiroshima.lg.jp/business/kassei/1021746/1006056/1033079/1013129.html'
          HIRO_PFI = 'https://www.city.hiroshima.lg.jp/business/kassei/1021746/1006056/1033079/1013132.html'
          HIRO_RESOUND = 'https://www.city.hiroshima.lg.jp/business/kassei/1021746/1006056/1033079/1032607.html'
          HIRO_TREE = 'https://www.city.hiroshima.lg.jp/living/park-green/1021378/1006063/1013325.html'
          hiro = '04_广岛和平大道_ParkPFI公共空间整备与运营完整链条'
          add(hiro, '01_和平大道利活用基本计划.pdf', lambda: resolve_pdf(HIRO_BASIC, ('平和大通りの利活用のための基本計画',), ('案', '概要')), 20)
          add(hiro, '02_基本计划公众意见募集结果.pdf', lambda: resolve_pdf(HIRO_COMMENT, ('市民意見募集の結果について',)), 1)
          add(hiro, '03_公众意见及广岛市回应.pdf', lambda: resolve_pdf(HIRO_COMMENT, ('御意見', '本市の考え方')), 3)
          add(hiro, '04_整备图景_01封面.pdf', lambda: resolve_pdf(HIRO_IMAGE, ('01', '表紙')), 1)
          add(hiro, '05_整备图景_02工作坊过程.pdf', lambda: resolve_pdf(HIRO_IMAGE, ('02', 'ワークショップの開催について')), 2)
          add(hiro, '06_整备图景_03整备方向.pdf', lambda: resolve_pdf(HIRO_IMAGE, ('03', '整備の方向性')), 2)
          add(hiro, '07_整备图景_04分区方向.pdf', lambda: resolve_pdf(HIRO_IMAGE, ('04', 'ゾーンごとの整備の方向性')), 2)
          add(hiro, '08_整备图景_05整备内容.pdf', lambda: resolve_pdf(HIRO_IMAGE, ('05', '整備内容')), 2)
          add(hiro, '09_整备图景_06都心回游据点.pdf', lambda: resolve_pdf(HIRO_IMAGE, ('06', '都心回遊の拠点')), 2)
          add(hiro, '10_整备图景_07利活用及整备创意.pdf', lambda: resolve_pdf(HIRO_IMAGE, ('07', '利活用及び整備のアイデア')), 2)
          add(hiro, '11_整备图景_08用户画像及场景.pdf', lambda: resolve_pdf(HIRO_IMAGE, ('08', '利用者像と利用シーン')), 2)
          add(hiro, '12_ParkPFI前期市场Sounding实施要领.pdf', lambda: resolve_pdf(HIRO_SOUND, ('公募型サウンディング調査実施要領',)), 3)
          add(hiro, '13_ParkPFI前期市场Sounding结果.pdf', lambda: resolve_pdf(HIRO_SOUND, ('サウンディング調査の結果について',)), 2)
          add(hiro, '14_ParkPFI公开征集设置指针.pdf', lambda: resolve_pdf(HIRO_PFI, ('公募設置等指針',), ('概要',)), 20)
          add(hiro, '15_ParkPFI要求水准书.pdf', lambda: resolve_pdf(HIRO_PFI, ('要求水準書',)), 10)
          add(hiro, '16_ParkPFI评价标准.pdf', lambda: resolve_pdf(HIRO_PFI, ('評価の基準',)), 3)
          add(hiro, '17_ParkPFI基本协议书草案.pdf', lambda: resolve_pdf(HIRO_PFI, ('Park-PFI', '基本協定書')), 5)
          add(hiro, '18_指定管理业务基本协议书草案.pdf', lambda: resolve_pdf(HIRO_PFI, ('指定管理業務', '基本協定書')), 5)
          add(hiro, '19_特定公园设施整备转让合同草案.pdf', lambda: resolve_pdf(HIRO_PFI, ('特定公園施設', '整備', '譲渡契約')), 3)
          add(hiro, '20_过往活动举办实绩.pdf', lambda: resolve_pdf(HIRO_PFI, ('過年度のイベント等開催実績',)), 2)
          add(hiro, '21_人员配置与会议出席者要求.pdf', lambda: resolve_pdf(HIRO_PFI, ('人員配置', '各種会議の出席者')), 2)
          add(hiro, '22_ParkPFI问题回答.pdf', lambda: resolve_pdf(HIRO_PFI, ('質問への回答',)), 3)
          add(hiro, '23_首次公开征集后再Sounding实施要领.pdf', lambda: resolve_pdf(HIRO_RESOUND, ('公募型サウンディング再調査実施要領',)), 3)
          add(hiro, '24_首次公开征集后再Sounding结果.pdf', lambda: resolve_pdf(HIRO_RESOUND, ('サウンディング再調査の結果について',)), 2)
          add(hiro, '25_和平大道树木管理指针.pdf', lambda: resolve_pdf(HIRO_TREE, ('平和大通り樹木管理指針',)), 5)

          expected_counts = {omiya: 14, kure: 13, maebashi: 19, hiro: 25}
          if len(entries) != sum(expected_counts.values()):
              raise RuntimeError(f'Entry setup mismatch: {len(entries)}')

          def download_pdf(url: str, target: Path, min_pages: int) -> tuple[int, int, str]:
              response = get(url, timeout=300)
              data = response.content
              if data[:5] != b'%PDF-':
                  preview = data[:250].decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'Not PDF: {url}; final={response.url}; type={response.headers.get("content-type")}; bytes={len(data)}; preview={preview!r}'
                  )
              if len(data) < 8_000:
                  raise RuntimeError(f'PDF too small: {url}; bytes={len(data)}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              reader = PdfReader(str(target), strict=False)
              pages = len(reader.pages)
              if pages < min_pages:
                  raise RuntimeError(f'{target}: pages {pages} below expected minimum {min_pages}')
              doc = pymupdf.open(str(target))
              if doc.page_count != pages:
                  raise RuntimeError(f'{target}: page-count mismatch pypdf={pages}, pymupdf={doc.page_count}')
              for pageno in sorted(set([0, pages // 2, pages - 1])):
                  pix = doc.load_page(pageno).get_pixmap(matrix=pymupdf.Matrix(0.30, 0.30), alpha=False)
                  if pix.width < 35 or pix.height < 35 or len(pix.samples) < 1000:
                      raise RuntimeError(f'{target}: representative render failed page {pageno + 1}')
              doc.close()
              return pages, len(data), hashlib.sha256(data).hexdigest()

          seen_hashes: dict[str, str] = {}
          stats: dict[str, dict[str, int]] = {}
          records = []
          for index, (folder, filename, source, min_pages) in enumerate(entries, 1):
              print(f'\n[{index}/{len(entries)}] {folder}/{filename}', flush=True)
              url = source() if callable(source) else source
              print(f'  SOURCE {url}', flush=True)
              target = ROOT / folder / filename
              pages, size, digest = download_pdf(url, target, min_pages)
              relative = str(target.relative_to(ROOT))
              if digest in seen_hashes:
                  target.unlink(missing_ok=True)
                  raise RuntimeError(f'Duplicate PDF content: {relative} == {seen_hashes[digest]}')
              seen_hashes[digest] = relative
              stat = stats.setdefault(folder, {'pdfs': 0, 'pages': 0, 'bytes': 0})
              stat['pdfs'] += 1
              stat['pages'] += pages
              stat['bytes'] += size
              records.append({'folder': folder, 'filename': filename, 'pages': pages, 'bytes': size, 'sha256': digest, 'source': url})
              print(f'  ACCEPTED {pages} pages {size/1024/1024:.1f} MB sha256={digest[:16]}...', flush=True)

          if set(stats) != set(expected_counts):
              raise RuntimeError(f'Project folders mismatch: {set(stats)}')
          for folder, expected in expected_counts.items():
              if stats[folder]['pdfs'] != expected:
                  raise RuntimeError(f'{folder}: {stats[folder]["pdfs"]} PDFs != expected {expected}')

          if ZIP_PATH.exists():
              ZIP_PATH.unlink()
          with zipfile.ZipFile(ZIP_PATH, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for pdf in sorted(ROOT.rglob('*.pdf')):
                  zf.write(pdf, pdf.relative_to(ROOT.parent))

          with zipfile.ZipFile(ZIP_PATH, 'r') as zf:
              names = zf.namelist()
              if len(names) != len(entries):
                  raise RuntimeError(f'ZIP entry count {len(names)} != expected {len(entries)}')
              if any(not name.lower().endswith('.pdf') for name in names):
                  raise RuntimeError('ZIP contains a non-PDF entry')
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')

          summary = {
              'batch': 11,
              'sets': len(stats),
              'pdfs': sum(v['pdfs'] for v in stats.values()),
              'pages': sum(v['pages'] for v in stats.values()),
              'source_bytes': sum(v['bytes'] for v in stats.values()),
              'zip_bytes': ZIP_PATH.stat().st_size,
              'zip_sha256': hashlib.sha256(ZIP_PATH.read_bytes()).hexdigest(),
              'folders': stats,
              'records': records,
          }
          (OUT / 'batch11_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n=== BATCH 11 VERIFIED SUMMARY ===', flush=True)
          for folder, values in stats.items():
              print(f"{folder}: {values['pdfs']} PDFs, {values['pages']} pages, {values['bytes']/1024/1024:.1f} MB", flush=True)
          print(json.dumps({
              'sets': summary['sets'],
              'pdfs': summary['pdfs'],
              'pages': summary['pages'],
              'source_mb': round(summary['source_bytes']/1024/1024, 1),
              'zip_mb': round(summary['zip_bytes']/1024/1024, 1),
              'zip_sha256': summary['zip_sha256'],
          }, ensure_ascii=False), flush=True)

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch11-complete-project-chains
          path: |
            output/Rurban_OS_Japan_Batch11_4_Complete_Project_Chains.zip
            output/batch11_summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
