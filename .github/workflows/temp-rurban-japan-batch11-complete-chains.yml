name: Temporary Rurban Japan Batch11 Complete Project Chains

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch11-complete-chains.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf

      - name: Download validate render-check and package official PDFs
        shell: python
        run: |
          from __future__ import annotations

          from pathlib import Path
          from urllib.parse import urljoin
          import hashlib
          import html as htmlmod
          import json
          import re
          import shutil
          import time
          import unicodedata
          import zipfile

          import pymupdf
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('output')
          ROOT = OUT / 'Rurban_OS_日本高质量方案库_第11批_4套完整项目链'
          ZIP_PATH = OUT / 'Rurban_OS_Japan_Batch11_4_Complete_Project_Chains.zip'
          shutil.rmtree(ROOT, ignore_errors=True)
          ROOT.mkdir(parents=True, exist_ok=True)

          retry = Retry(
              total=5,
              connect=5,
              read=5,
              backoff_factor=1.2,
              status_forcelist=(408, 425, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET', 'HEAD'}),
          )
          session = requests.Session()
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.mount('http://', HTTPAdapter(max_retries=retry))
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'ja,en-US;q=0.8,en;q=0.6',
          }

          def norm(value: str) -> str:
              value = unicodedata.normalize('NFKC', htmlmod.unescape(value or '')).lower()
              return re.sub(r'[\s\u3000\-‐‑–—_・/\\()（）\[\]【】「」『』<>:：,，.。]+', '', value)

          def get(url: str, timeout: int = 180) -> requests.Response:
              last = None
              for attempt in range(1, 5):
                  try:
                      response = session.get(url, headers=HEADERS, timeout=timeout, allow_redirects=True)
                      response.raise_for_status()
                      return response
                  except Exception as exc:
                      last = exc
                      print(f'  retry {attempt}/4 {url}: {type(exc).__name__}: {exc}', flush=True)
                      time.sleep(min(2 ** attempt, 8))
              raise RuntimeError(f'GET failed after retries: {url}: {last}')

          page_cache: dict[str, list[tuple[str, str]]] = {}

          def page_links(page_url: str) -> list[tuple[str, str]]:
              if page_url in page_cache:
                  return page_cache[page_url]
              response = get(page_url)
              try:
                  text = response.content.decode('utf-8')
              except UnicodeDecodeError:
                  text = response.content.decode(response.apparent_encoding or 'cp932', errors='replace')
              soup = BeautifulSoup(text, 'html.parser')
              found: list[tuple[str, str]] = []
              seen: set[str] = set()
              for anchor in soup.find_all('a', href=True):
                  href = urljoin(response.url, anchor.get('href', '').strip())
                  href = href.replace('/page/cmsfiles/', '/cmsfiles/')
                  label = ' '.join(anchor.stripped_strings)
                  if href and href not in seen:
                      seen.add(href)
                      found.append((label, href))
              page_cache[page_url] = found
              print(f'DISCOVER {page_url}: {len(found)} links', flush=True)
              return found

          def resolve_pdf(page_url: str, include: tuple[str, ...], exclude: tuple[str, ...] = (), occurrence: int = 0) -> str:
              required = tuple(norm(x) for x in include)
              forbidden = tuple(norm(x) for x in exclude)
              ranked = []
              for label, href in page_links(page_url):
                  blob = norm(label + ' ' + href)
                  if not all(x in blob for x in required):
                      continue
                  if any(x in blob for x in forbidden):
                      continue
                  if '.pdf' not in href.lower() and 'pdf' not in norm(label):
                      continue
                  score = 100 if '.pdf' in href.lower() else 0
                  score += sum(30 for x in required if x in norm(label))
                  if '概要版' in label or 'リーフレット' in label or 'パンフレット' in label:
                      score -= 40
                  ranked.append((score, label, href))
              ranked.sort(reverse=True)
              if len(ranked) <= occurrence:
                  available = '\n'.join(
                      f'    {label[:130]} -> {href}'
                      for label, href in page_links(page_url)
                      if '.pdf' in href.lower() or 'pdf' in norm(label)
                  )
                  raise RuntimeError(
                      f'No PDF matched include={include!r}, exclude={exclude!r}, occurrence={occurrence} on {page_url}\n{available}'
                  )
              chosen = ranked[occurrence]
              print(f'RESOLVE {include}: {chosen[1]} -> {chosen[2]}', flush=True)
              return chosen[2]

          entries: list[tuple[str, str, object, int]] = []
          def add(folder: str, filename: str, source: object, min_pages: int = 1):
              entries.append((folder, filename, source, min_pages))

          # 01 Omiya GCS: strategic vision -> station-city concept -> executable plan -> district parking operation rules.
          OMIYA_VISION = 'https://www.city.saitama.lg.jp/001/010/015/004/001/003/p011083.html'
          OMIYA_CONCEPT = 'https://www.city.saitama.lg.jp/001/010/015/004/007/001/001/p052328.html'
          OMIYA_PLAN = 'https://www.city.saitama.lg.jp/001/010/015/004/007/001/002/p080137.html'
          OMIYA_PARKING = 'https://www.city.saitama.lg.jp/001/010/015/004/007/001/002/p099790.html'
          omiya = '01_大宫GCS_站城一体化与停车运营规则完整链条'
          add(omiya, '01_战略愿景_封面与目录.pdf', lambda: resolve_pdf(OMIYA_VISION, ('0.', '表紙', '目次')), 1)
          add(omiya, '02_战略愿景_基本方针.pdf', lambda: resolve_pdf(OMIYA_VISION, ('1.', 'はじめに', '基本方針')), 2)
          add(omiya, '03_战略愿景_制定视点.pdf', lambda: resolve_pdf(OMIYA_VISION, ('2.', '策定の視点')), 2)
          add(omiya, '04_战略愿景_未来图景.pdf', lambda: resolve_pdf(OMIYA_VISION, ('3.', '将来像')), 2)
          add(omiya, '05_战略愿景_实现战略.pdf', lambda: resolve_pdf(OMIYA_VISION, ('4.', '将来像を実現するための戦略')), 5)
          add(omiya, '06_战略愿景_推进机制.pdf', lambda: resolve_pdf(OMIYA_VISION, ('5.', '戦略ビジョンの推進')), 2)
          add(omiya, '07_战略愿景_检讨经过1.pdf', lambda: resolve_pdf(OMIYA_VISION, ('6.', '検討の経緯', '1')), 2)
          add(omiya, '08_战略愿景_检讨经过2.pdf', lambda: resolve_pdf(OMIYA_VISION, ('6.', '検討の経緯', '2')), 2)
          add(omiya, '09_大宫GCS化构想_正式原文.pdf', lambda: resolve_pdf(OMIYA_CONCEPT, ('原文', '大宮駅グランドセントラルステーション化構想')), 10)
          add(omiya, '10_大宫GCS_Plan2020_P1-84.pdf', lambda: resolve_pdf(OMIYA_PLAN, ('P.1-84',)), 50)
          add(omiya, '11_大宫GCS_Plan2020_P85-118.pdf', lambda: resolve_pdf(OMIYA_PLAN, ('P.85-118',)), 20)
          add(omiya, '12_都市再生停车设施配置计划.pdf', lambda: resolve_pdf(OMIYA_PARKING, ('都市再生駐車施設配置計画', '本編')), 10)
          add(omiya, '13_停车地域规则_运营手册.pdf', lambda: resolve_pdf(OMIYA_PARKING, ('運用マニュアル',)), 10)
