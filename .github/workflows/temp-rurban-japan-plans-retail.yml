name: Temporary Rurban Japan Retail Plan Downloader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-plans-retail.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare
        run: python -m pip install --quiet requests pypdf beautifulsoup4

      - name: Download retail and destination facility plans
        shell: python
        run: |
          import concurrent.futures, json, time, zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          plans = [
            {"id":"NARUTO","name":"57_鸣门市道之驿基本计划.pdf","url":"https://www.city.naruto.lg.jp/docs/2024042505543/file_contents/2024042505543__files_00227131_michinoeki_kihonkeikaku.pdf","min_pages":55},
            {"id":"SHOP01","name":"58_日本商店街可持续发展方法手册.pdf","url":"https://www.chusho.meti.go.jp/shogyo/shogyo/2022/220426shoutengai01.pdf","min_pages":25},
            {"id":"SHOP02","name":"59_日本商店街行动案例集.pdf","url":"https://www.chusho.meti.go.jp/shogyo/shogyo/2022/220426shoutengai02.pdf","min_pages":35},
            {"id":"SAITAMA_BASE","name":"60_埼玉市道之驿基本计划.pdf","page":"https://www.city.saitama.lg.jp/005/002/008/001/p080311.html","needle":"基本計画（PDF形式 6,208","min_pages":30},
            {"id":"SAITAMA_IMPL","name":"61_埼玉市道之驿整备计划.pdf","page":"https://www.city.saitama.lg.jp/005/002/008/001/p125881.html","needle":"整備計画（PDF形式 6,044","min_pages":30},
          ]

          out=Path('output'); pdfdir=out/'pdfs'; pdfdir.mkdir(parents=True,exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept':'application/pdf,text/html,*/*;q=0.8','Accept-Language':'ja,en;q=0.7'}

          def resolve(plan,s):
            if 'url' in plan: return plan['url']
            r=s.get(plan['page'],headers=headers,timeout=(20,60)); r.raise_for_status()
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              if plan['needle'] in text:
                return urljoin(plan['page'],a['href'])
            # fallback: find PDF links and choose by distinguishing base/implementation in surrounding text
            candidates=[]
            for a in soup.find_all('a',href=True):
              href=urljoin(plan['page'],a['href'])
              text=' '.join(a.get_text(' ',strip=True).split())
              if '.pdf' in href.lower(): candidates.append((text,href))
            raise RuntimeError(f'link not found; candidates={candidates[:10]}')

          def dl(plan):
            rec={**plan,'status':'failed','resolved_url':'','pages':None,'bytes':0,'error':''}
            target=pdfdir/plan['name']; tmp=target.with_suffix('.part')
            s=requests.Session()
            try:
              url=resolve(plan,s); rec['resolved_url']=url
              for attempt in range(1,4):
                try:
                  with s.get(url,headers=headers,stream=True,timeout=(25,180),allow_redirects=True) as r:
                    r.raise_for_status()
                    with open(tmp,'wb') as f:
                      for chunk in r.iter_content(1024*1024):
                        if chunk: f.write(chunk)
                  break
                except Exception:
                  if tmp.exists(): tmp.unlink()
                  if attempt==3: raise
                  time.sleep(attempt*3)
              size=tmp.stat().st_size
              if size<50000: raise RuntimeError(f'too small {size}')
              with open(tmp,'rb') as f: head=f.read(8)
              if not head.startswith(b'%PDF'): raise RuntimeError(f'not pdf {head!r}')
              pages=len(PdfReader(str(tmp),strict=False).pages)
              if pages<plan['min_pages']: raise RuntimeError(f'pages {pages} below {plan["min_pages"]}')
              tmp.replace(target); rec.update(status='accepted',pages=pages,bytes=size,error='')
            except Exception as e:
              rec['error']=f'{type(e).__name__}: {e}'
              if tmp.exists(): tmp.unlink()
            return rec

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
            for r in ex.map(dl,plans):
              results.append(r); print(r,flush=True)
          accepted=[r for r in results if r['status']=='accepted']
          zpath=out/'Rurban_OS_日本商业与道之驿补充方案.zip'
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for r in accepted: z.write(pdfdir/r['name'],arcname=r['name'])
          with open(out/'download_manifest.json','w',encoding='utf-8') as f: json.dump({'accepted_count':len(accepted),'results':results},f,ensure_ascii=False,indent=2)
          print(f'FINAL {len(accepted)}/{len(results)} {zpath.stat().st_size}',flush=True)
          if len(accepted)<3: raise SystemExit('Too few downloads')

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-retail-plans
          path: |
            output/Rurban_OS_日本商业与道之驿补充方案.zip
            output/download_manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
