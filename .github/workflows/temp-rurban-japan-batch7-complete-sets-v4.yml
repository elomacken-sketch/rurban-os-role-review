name: Temporary Rurban Japan Batch7 Complete Sets V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch7-complete-sets-v4.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests pypdf beautifulsoup4 pymupdf pyyaml
      - name: Execute corrected batch7 downloader
        shell: python
        run: |
          from pathlib import Path
          import re
          import yaml

          source = Path('.github/workflows/temp-rurban-japan-batch7-complete-sets-v2.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          script = data['jobs']['build']['steps'][1]['run']
          pattern = r"(?m)^(\s*)href = urljoin\(url, a\.get\('href', ''\)\)$"
          replacement = r"\1href = urljoin(url, a.get('href', ''))\n\1href = href.replace('/page/cmsfiles/', '/cmsfiles/')"
          script, count = re.subn(pattern, replacement, script, count=1)
          if count != 1:
              raise SystemExit(f'Expected one URL normalization insertion point, found {count}')
          exec(compile(script, '<batch7-v4>', 'exec'), {'__name__': '__main__'})
      - name: Upload verified PDF-only package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch7-complete-sets-v4
          path: output/Rurban_OS_Japan_Batch07_4_Relatively_Complete_Project_Sets.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
