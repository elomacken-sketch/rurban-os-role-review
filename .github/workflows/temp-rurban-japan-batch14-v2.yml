name: Temporary Rurban Japan Batch14 Commercial Operations Chains V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rurban-japan-batch14-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pyyaml
      - name: Execute corrected batch14 downloader
        shell: python
        run: |
          from pathlib import Path
          import yaml

          source = Path('.github/workflows/temp-rurban-japan-batch14.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          script = data['jobs']['build']['steps'][2]['run']

          replacements = [
              (
                  "add(suma, '05_提供资料清单_最终修订版.pdf', lambda: resolve_pdf(SUMA_PROC, ('2019年7月5日改訂', '提供資料一覧')), 2)",
                  "add(suma, '05_提供资料清单_最终修订版.pdf', lambda: resolve_pdf(SUMA_PROC, ('2019年7月5日改訂', '提供資料一覧')), 1)",
              ),
              (
                  "add(suma, '13_中选方案概要.pdf', lambda: resolve_pdf(SUMA_PROC, ('提案の概要',)), 3)",
                  "add(suma, '13_中选方案概要.pdf', lambda: resolve_pdf(SUMA_PROC, ('提案の概要',)), 1)",
              ),
              (
                  "add(suma, '15_中选方案项目意象.pdf', lambda: resolve_pdf(SUMA_PROC, ('事業イメージ',)), 3)",
                  "add(suma, '15_中选方案项目意象.pdf', lambda: resolve_pdf(SUMA_PROC, ('事業イメージ',)), 1)",
              ),
          ]
          for old, new in replacements:
              if old not in script:
                  raise SystemExit(f'Expected patch target not found: {old}')
              script = script.replace(old, new, 1)

          exec(compile(script, '<batch14-v2>', 'exec'), {'__name__': '__main__'})
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: rurban-os-japan-batch14-commercial-operations-v2
          path: |
            output/Rurban_OS_Japan_Batch14_4_Commercial_Operations_Project_Chains.zip
            output/batch14_summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
