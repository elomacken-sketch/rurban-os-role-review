name: Temporary Japan Batch15 Original Documents
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-japan-batch15-20261010.yml']
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare
        run: python -m pip install --quiet requests beautifulsoup4 pymupdf pypdf
      - name: Download official originals and validate
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests, json, hashlib, re, zipfile, unicodedata, time
          from bs4 import BeautifulSoup
          import fitz
          from pypdf import PdfReader

          OUT=Path('output'); ROOT=OUT/'PDFs'; ROOT.mkdir(parents=True, exist_ok=True)
          HEADERS={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Accept-Language':'ja,en;q=0.7'}
          ONI='01_茨木Onikuru_前期主方案与运营公开资料'
          AIC='02_AichiSkyExpo_运营招募与监督财务资料'
          HIB='03_东京Midtown日比谷_活动场地专项手册'
          CAF='https://www.city.ibaraki.osaka.jp/kikou/shimin/kyousou/menu/kouji/60501.html'
          NEW='https://www.pref.aichi.jp/soshiki/kokusai-kanko/kaitou2.html'
          EVA='https://www.pref.aichi.jp/soshiki/kokusai-kanko/torikumijyoukyou.html'
          SEL='https://www.pref.aichi.jp/soshiki/kokusai-kanko/sentei.html'
          FIN='https://www.aichiskyexpo.com/organizer-top/financial-info/'
          PAM='https://www.aichiskyexpo.com/organizer-top/download-pamphlet/'
          rows=[]
          def direct(folder,name,url): rows.append({'folder':folder,'filename':name+'.pdf','url':url})
          def linked(folder,name,page,terms,exclude=()): rows.append({'folder':folder,'filename':name+'.pdf','page':page,'terms':list(terms),'exclude':list(exclude)})
          direct(ONI,'01_基本构想_正式本','https://www.city.ibaraki.osaka.jp/material/files/group/13/atochieriaaktuyoukihonkousou.pdf')
          direct(ONI,'02_基本计划_正式本','https://www.city.ibaraki.osaka.jp/material/files/group/104/20181228atochieriakihonnkeikaku.pdf')
          direct(ONI,'03_基本计划_调查资料篇','https://www.city.ibaraki.osaka.jp/material/files/group/104/20181228iakihonnkeikakushiryouhen.pdf')
          direct(ONI,'04_新设施及广场管理运营计划_正式本','https://www.city.ibaraki.osaka.jp/material/files/group/104/shinshisetsuhirobakanriunei.pdf')
          direct(ONI,'05_文化大厅中选方事业计划_公开版','https://www.city.ibaraki.osaka.jp/material/files/group/13/R4_jigyoukeikaku_onikuru.pdf')
          direct(ONI,'06_市民活动中心事业计划_公开版','https://www.city.ibaraki.osaka.jp/material/files/group/99/h4_jigyoukeikaku_suishinnet_sashikae.pdf')
          direct(ONI,'07_室内儿童广场事业计划_公开版','https://www.city.ibaraki.osaka.jp/material/files/group/13/R4_jigyoukeikaku_okunaikodomo.pdf')
          linked(ONI,'08_咖啡店运营商招募要项',CAF,('募集要項','修正'))
          linked(ONI,'09_咖啡店招募问题及回答',CAF,('質疑兼回答書',))
          linked(ONI,'10_咖啡店空间与设施条件',CAF,('おにクルカフェ概要',))
          linked(ONI,'11_各楼层平面图',CAF,('おにクル簡易平面図',))
          direct(ONI,'12_开馆记录_伊东丰雄对谈与参与者访谈','https://www.city.ibaraki.osaka.jp/material/files/group/104/onikuruhajimaru.pdf')
          direct(ONI,'13_育成广场ProjectBook_第1章','https://www.city.ibaraki.osaka.jp/material/files/group/104/sodaterubook1.pdf')
          direct(ONI,'14_育成广场ProjectBook_第2章','https://www.city.ibaraki.osaka.jp/material/files/group/104/sodaterubook-2.pdf')
          direct(ONI,'15_育成广场ProjectBook_第3章','https://www.city.ibaraki.osaka.jp/material/files/group/104/sodaterubook2.pdf')
          linked(ONI,'16_设施使用指南_官网版本','https://www.onikuru.jp/rental/download/',('利用のご案内',))
          direct(AIC,'01_运营商招募要项_2017年8月修订','https://www.pref.aichi.jp/uploaded/attachment/246640.pdf')
          direct(AIC,'02_运营要求水准书','https://www.pref.aichi.jp/uploaded/attachment/246647.pdf')
          direct(AIC,'03_运营监督基本计划','https://www.pref.aichi.jp/uploaded/attachment/246651.pdf')
          direct(AIC,'04_优先谈判方评选标准','https://www.pref.aichi.jp/uploaded/attachment/246648.pdf')
          direct(AIC,'05_基本协议书_招募时版本','https://www.pref.aichi.jp/uploaded/attachment/246649.pdf')
          direct(AIC,'06_公共设施运营权实施合同_招募时版本','https://www.pref.aichi.jp/uploaded/attachment/246650.pdf')
          direct(AIC,'07_招募问题意见及回答','https://www.pref.aichi.jp/uploaded/attachment/246653.pdf')
          direct(AIC,'08_开业准备要求与时间表','https://www.pref.aichi.jp/uploaded/attachment/244348.pdf')
          direct(AIC,'09_中长期修缮计划_案','https://www.pref.aichi.jp/uploaded/attachment/244350.pdf')
          linked(AIC,'10_运营商选定审查报告',SEL,('コンセッション審査報告',))
          linked(AIC,'11_2023年度运营报告及政府评价',EVA,('2023年度',))
          linked(AIC,'12_2024年度运营报告及政府评价',EVA,('2024年度',))
          direct(AIC,'13_2025年度运营报告及政府评价','https://www.pref.aichi.jp/uploaded/attachment/627352.pdf')
          linked(AIC,'14_第7期财务报表与会计师审阅报告_2024年3月期',FIN,('第7期',))
          linked(AIC,'15_第8期财务报表与会计师审阅报告_2025年3月期',FIN,('第8期',))
          direct(AIC,'16_第9期财务报表与会计师审阅报告_2026年3月期','https://www.aichiskyexpo.com/wp-content/uploads/2026/06/kessan_8.pdf')
          linked(AIC,'17_2024年度OpenBook公开核算报告',FIN,('2024年度','オープンブック'))
          linked(AIC,'18_设施使用规约_2025年4月修订','https://www.aichiskyexpo.com/organizer-top/useflow/',('愛知県国際展示場利用規約',))
          linked(AIC,'19_设施指南',PAM,('Aichi Sky Expo施設ガイド',))
          linked(AIC,'20_广告媒体使用指南',PAM,('メディアガイド',))
          direct(HIB,'01_活动场地及媒体使用手册_2026年9月版','https://www.hibiya.tokyo-midtown.com/assets/pdf/event-space/tmh_eventspace_guidebook_20260901.pdf')

          def norm(s): return re.sub(r'\s+','',unicodedata.normalize('NFKC',s or '')).lower()
          def get(url):
              last=None
              for n in range(3):
                  try:
                      r=requests.get(url,headers=HEADERS,timeout=(20,80)); r.raise_for_status(); return r
                  except Exception as e: last=e; time.sleep(n+1)
              raise last
          cache={}
          def links(page):
              if page in cache: return cache[page]
              r=get(page)
              try: text=r.content.decode('utf-8')
              except UnicodeDecodeError: text=r.content.decode(r.apparent_encoding or 'cp932',errors='replace')
              soup=BeautifulSoup(text,'html.parser'); found=[]
              for a in soup.find_all('a',href=True):
                  u=urljoin(r.url,a['href'])
                  if '.pdf' not in u.lower(): continue
                  lab=' '.join(a.stripped_strings)+' '+a.get('title','')+' '+' '.join(im.get('alt','') for im in a.find_all('img'))
                  found.append((lab,u))
              cache[page]=found
              return found
          resolved=[]; failed=[]
          for row in rows:
              try:
                  if 'url' not in row:
                      candidates=[(lab,u) for lab,u in links(row['page']) if all(norm(t) in norm(lab) for t in row['terms']) and not any(norm(x) in norm(lab) for x in row['exclude'])]
                      candidates=list({u:(lab,u) for lab,u in candidates}.values())
                      if len(candidates)!=1: raise RuntimeError('ambiguous or missing PDF match '+str(candidates)+'; available='+str(links(row['page'])))
                      row['url']=candidates[0][1]; row['source_label']=candidates[0][0]
                  resolved.append(row)
              except Exception as e: failed.append({**row,'error':str(e)}); print('RESOLVE FAILED',row['filename'],str(e),flush=True)
          def download(row):
              r=get(row['url']); data=r.content
              if not data[:1024].lstrip().startswith(b'%PDF-'): raise RuntimeError('not PDF '+r.url)
              p=ROOT/row['folder']/row['filename']; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
              return {**row,'final_url':r.url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'path':str(p.relative_to(ROOT))}
          records=[]
          with ThreadPoolExecutor(max_workers=4) as pool:
              fs={pool.submit(download,row):row for row in resolved}
              for f in as_completed(fs):
                  row=fs[f]
                  try: records.append(f.result()); print('DOWNLOADED',row['filename'],flush=True)
                  except Exception as e: failed.append({**row,'error':str(e)}); print('DOWNLOAD FAILED',row['filename'],str(e),flush=True)
          accepted=[]; seen=set()
          for row in sorted(records,key=lambda r:r['path']):
              p=ROOT/row['path']
              try:
                  if row['sha256'] in seen: raise RuntimeError('duplicate content')
                  d=fitz.open(p); row['pages']=len(d)
                  if not row['pages'] or d.needs_pass: raise RuntimeError('empty or encrypted')
                  if len(PdfReader(str(p),strict=False).pages)!=row['pages']: raise RuntimeError('page-count mismatch')
                  for i in sorted(set([0,len(d)//2,len(d)-1])):
                      pix=d[i].get_pixmap(matrix=fitz.Matrix(.3,.3),alpha=False)
                      if pix.width<35 or pix.height<35: raise RuntimeError('invalid rendered page')
                  d.close(); seen.add(row['sha256']); accepted.append(row)
                  print('VALID',row['path'],row['pages'],row['bytes'],flush=True)
              except Exception as e: failed.append({**row,'error':str(e)}); p.unlink(missing_ok=True)
          pack=OUT/'batch15_originals_transfer.zip'
          with zipfile.ZipFile(pack,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for row in accepted: z.write(ROOT/row['path'],row['path'])
          with zipfile.ZipFile(pack) as z:
              if z.testzip(): raise RuntimeError('archive CRC failed')
          (OUT/'batch15_manifest.json').write_text(json.dumps({'accepted':accepted,'failed':failed,'pdfs':len(accepted),'pages':sum(r['pages'] for r in accepted),'zip_bytes':pack.stat().st_size},ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY',len(accepted),sum(r['pages'] for r in accepted),pack.stat().st_size,flush=True)
          if len(accepted)<10: raise RuntimeError('too few files')
      - name: Transfer files for local review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-batch15-review-20261010
          path: |
            output/batch15_originals_transfer.zip
            output/batch15_manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
